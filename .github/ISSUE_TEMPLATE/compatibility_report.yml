name: App Compatibility Report
description: Submit verified compatibility results or configuration workarounds for an Android application on WSA.
title: "[Compat]: [App Name] - [Working / Workaround Required / Broken]"
labels: ["compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping build the community compatibility database! Your report will be verified and added to `compatibility/data/[AppName].json`.

  - type: input
    id: app_name
    attributes:
      label: Application Name
      description: Official name of the Android app.
      placeholder: "e.g. PhonePe / SBI YONO / Paytm / Netflix"
    validations:
      required: true

  - type: input
    id: package_id
    attributes:
      label: Android Package Identifier (Application ID)
      description: Found in the Google Play Store URL (e.g. https://play.google.com/store/apps/details?id=com.example.app).
      placeholder: "e.g. com.phonepe.app"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Compatibility Status
      description: Operational status of the app under WSA.
      options:
        - "Working (Runs out of the box with zero modifications)"
        - "Workaround Required (Runs after specific Magisk / Zygisk / DenyList configuration)"
        - "Broken (Crashes on launch / Root detected / Hardware attestation blocked)"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Application Category
      description: Primary classification of the app.
      options:
        - "Banking & UPI"
        - "Social & Communication"
        - "Productivity & Office"
        - "Streaming & Media"
        - "Gaming"
        - "Utilities & Tools"
    validations:
      required: true

  - type: input
    id: tested_version
    attributes:
      label: Tested WSA Release Version
      description: The WSA build version you conducted testing on.
      placeholder: "e.g. Enter tested WSA build version (from WSA Settings -> About)"
    validations:
      required: true

  - type: dropdown
    id: root_flavor
    attributes:
      label: Tested Root Flavor
      description: Which build flavor was used?
      options:
        - "Magisk Stable"
        - "No Root (Vanilla WSA)"
    validations:
      required: true

  - type: dropdown
    id: play_integrity
    attributes:
      label: Play Integrity Status
      description: Does this application require Play Integrity attestation?
      options:
        - "Yes - Passes MEETS_DEVICE_INTEGRITY (with PIF module)"
        - "Yes - Fails Play Integrity (Hardware backed attestation required)"
        - "No / Not Applicable"
    validations:
      required: true

  - type: textarea
    id: workaround_steps
    attributes:
      label: Workaround Instructions (If applicable)
      description: Step-by-step instructions to get the application working.
      placeholder: |
        1. Enable Zygisk in Magisk settings.
        2. Install latest PlayIntegrityFix module.
        3. Add application to Magisk DenyList.
        4. Disable USB Debugging in WSA Advanced Settings.
    validations:
      required: false

  - type: textarea
    id: known_issues
    attributes:
      label: Known Limitations / Symptoms
      description: Any observed limitations (e.g. biometric login unavailable, notifications delayed).
      placeholder: "Biometric login falls back to PIN. Video DRM restricted to SD."
    validations:
      required: false
