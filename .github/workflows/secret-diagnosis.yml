name: Secret Content Diagnosis (temporary)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare secret fingerprints
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          echo "TOKEN  length: ${#CF_TOKEN}  (expected 53)"
          echo "TOKEN  sha256: $(printf '%s' "$CF_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "                (expected d111d4d12334afe45b0f407bd4aa1cc07bd7030eecf6a2d3cbf6444419329a0b)"
          echo "ACCOUNT length: ${#CF_ACCOUNT}  (expected 32)"
          echo "ACCOUNT sha256: $(printf '%s' "$CF_ACCOUNT" | sha256sum | cut -d' ' -f1)"
          echo "                (expected 344802dcf3081de60a086245d5425417fac768a8015cd6bf123ceee3b2f4cb52)"

      - name: Reproduce Pages API call with secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          echo "--- GET specific project ---"
          curl -s -o /tmp/p1.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/wsabuilds-website"
          cat /tmp/p1.json | head -c 400; echo
          echo "--- GET accounts (scope sanity) ---"
          curl -s -o /tmp/p2.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts"
          cat /tmp/p2.json | head -c 300; echo
          echo "NOTE: no secret values are printed above; only HTTP codes and API responses."
