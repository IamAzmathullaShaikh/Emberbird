# =============================================================================
# update.yml — WSABuilds automated update & release dispatch
#
# Triggered manually (workflow_dispatch).
# Checks for new WSA retail versions and component updates, then dispatches
# a single build: WSA x64 | Magisk Stable | OpenGApps Pico
#
# Inputs:
#   wsa_ver      (optional) Override the WSA version to build.
#                           Leave empty to auto-detect the latest retail release.
#   wsa_message  (required) Human-readable release note, e.g. "2311.40000.4.0"
#   release_type (choice)   Must be "retail" — other values are rejected.
# =============================================================================

name: Check update & build

on:
  workflow_dispatch:
    inputs:
      wsa_ver:
        type: string
        description: >
          WSA version to build (optional).
          Leave empty to auto-detect the latest retail release.
        required: false

      wsa_message:
        type: string
        description: Human-readable release note (e.g. "2311.40000.4.0 — December update")
        required: true

      release_type:
        type: choice
        description: Release channel — only "retail" (stable) is supported.
        required: true
        default: retail
        options:
          - retail

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# =============================================================================
# Jobs
# =============================================================================

jobs:

  # ---------------------------------------------------------------------------
  # check — verify component versions and decide whether a build is needed
  # ---------------------------------------------------------------------------
  check:
    name: Check component versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout ♻️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14

      - name: Setup Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install Python dependencies 🐍
        run: pip3 install --quiet beautifulsoup4 lxml requests packaging certifi

      # Check Magisk stable version using repository-local script
      - name: Check Magisk Stable version ✅
        run: |
          python3 tools/update-check/MagiskStableUpdateCheck.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Check GApps version using repository-local script for LSPosed/WSA-Addon
      - name: Check GApps (WSA-Addon) version ☑️
        run: |
          python3 tools/update-check/GAppsAddonUpdateCheck.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Check WSA retail version using repository-local script
      - name: Check WSA Retail version ☑️
        run: |
          python3 tools/update-check/WSARetailUpdateCheck.py
        env:
          WSA_XML_DIR: ${{ github.workspace }}/upstream/xml
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Summarise component versions 📋
        run: |
          echo "=========================================="
          echo "Component Versions & Update Status"
          echo "=========================================="
          echo "Magisk Version  : $MAGISK_STABLE_MSG"
          echo "GApps Version   : $GAPPS_MSG"
          echo "GApps Tag       : $GAPPS_TAG"
          echo "GApps Asset     : $GAPPS_ASSET"
          echo "WSA Version     : $LATEST_RETAIL_VER"
          echo "Update Status   : $WSA_UPDATE_STATUS"
          echo "Build Triggered : $RETAIL_UPDATE"
          echo "=========================================="

    outputs:
      MAGISK_STABLE_MSG:    ${{ env.MAGISK_STABLE_MSG }}
      GAPPS_TAG:            ${{ env.GAPPS_TAG }}
      GAPPS_ASSET:          ${{ env.GAPPS_ASSET }}
      GAPPS_RC:             ${{ env.GAPPS_RC }}
      GAPPS_MSG:            ${{ env.GAPPS_MSG }}
      GAPPS_VARIANT:        ${{ env.GAPPS_VARIANT }}
      RETAIL_UPDATE:        ${{ env.RETAIL_UPDATE }}
      LATEST_RETAIL_VER:    ${{ env.LATEST_RETAIL_VER }}
      WSA_UPDATE_STATUS:    ${{ env.WSA_UPDATE_STATUS }}

  # ---------------------------------------------------------------------------
  # update-downloadlinks — update README badges / download links table
  # ---------------------------------------------------------------------------
  update-downloadlinks:
    name: Update README download links
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 15
    permissions:
      contents: write
    if: inputs.wsa_ver != '' || needs.check.outputs.RETAIL_UPDATE == 'yes'

    steps:
      - name: Checkout 🔄
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet beautifulsoup4 PyGithub lxml

      - name: Resolve WSA version and compose badge links
        run: |
          ver="${{ inputs.wsa_ver || needs.check.outputs.LATEST_RETAIL_VER }}"
          win11x64='<p><a href="https://github.com/'"${{ github.repository }}"'/releases/tag/Windows_11_'"${ver}"'"><img alt="win11x64downstable" src="https://img.shields.io/badge/Download%20Latest%20Stable%20Build-Windows%2011%20x64-blue?style=for-the-badge&amp;logo=windows11"/></a></p>'
          {
            echo "LINK_FOR_W11X64=${win11x64}"
            echo "LATEST_VER=${ver}"
          } >> "$GITHUB_ENV"

      - name: Replace download link in README.md
        run: python "./tools/update-check/update-downloadlinks.py"
        env:
          LINK_FOR_W11X64: ${{ env.LINK_FOR_W11X64 }}
          RELEASE_TYPE: retail
          LATEST_VER:   ${{ env.LATEST_VER }}

      - name: Commit and push if changed
        run: |
          git diff --quiet && { echo "No changes to README.md"; exit 0; }
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"
          git commit -am "Update download link for WSA $LATEST_VER"
          git pull --rebase origin master
          git push

  # ---------------------------------------------------------------------------
  # prepare-release — check tag existence and format release notes
  # ---------------------------------------------------------------------------
  prepare-release:
    name: Prepare release notes & verify tag
    runs-on: ubuntu-latest
    needs: [check, update-downloadlinks]
    timeout-minutes: 15
    permissions:
      contents: read
    if: inputs.wsa_ver != '' || needs.check.outputs.RETAIL_UPDATE == 'yes'

    steps:
      - name: Checkout 🔄
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14
        with:
          fetch-depth: 0

      - name: Resolve WSA version
        run: |
          ver="${{ inputs.wsa_ver || needs.check.outputs.LATEST_RETAIL_VER }}"
          {
            echo "WSA_VER=${ver}"
            echo "WIN11X64_TAG=Windows_11_${ver}"
          } >> "$GITHUB_ENV"

      # Native Git tag check — prevents duplicate releases without 3rd-party action
      - name: Check if Windows 11 x64 tag exists
        id: check-tag
        run: |
          if git rev-parse -q --verify "refs/tags/$WIN11X64_TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if tag already exists
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          echo "Tag $WIN11X64_TAG already exists — nothing to do."
          exit 1

      # Use local in-repo release notes template (no external gist dependency)
      - name: Prepare release notes template 📥
        run: |
          cp templates/release-notes-retail.md Windows11x64.md

      # Substitute template placeholders
      - name: Fill in release notes ✏️
        shell: python
        env:
          GITHUB_WORKSPACE:     ${{ github.workspace }}
          MAGISK_STABLE_MSG:    ${{ needs.check.outputs.MAGISK_STABLE_MSG }}
          GAPPS_TAG:            ${{ needs.check.outputs.GAPPS_TAG }}
          GAPPS_VARIANT:        ${{ needs.check.outputs.GAPPS_VARIANT }}
          WSA_VER:              ${{ env.WSA_VER }}
        run: |
          import os, re
          from datetime import datetime, timezone

          now  = datetime.now(timezone.utc)
          date = now.strftime("%d/%m/%Y")
          time = now.strftime("%H:%M:%S UTC")

          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "Windows11x64.md")
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          substitutions = {
              "<<DATEOF RELEASE>>":      date,
              "<<TIMEOF RELEASE>>":      time,
              "<<REASONFOR RELEASE>>":   "Scheduled update",
              "<<WSA ANDROID VERSION>>": "Android 13",
              "<<WSA_VER>>":             os.environ.get("WSA_VER", ""),
              "<<MAGISK STABLE VER>>":   os.environ.get("MAGISK_STABLE_MSG", ""),
              "<<GAPPS VARIANT>>":       os.environ.get("GAPPS_VARIANT", "Pico (WSA-Addon)"),
              "<<GAPPS TAG>>":           os.environ.get("GAPPS_TAG", "v2"),
          }
          for placeholder, value in substitutions.items():
              text = text.replace(placeholder, value)

          text = re.sub(r"<<DATEOFRELEASE>>",    date,                              text)
          text = re.sub(r"<<TIMEOFRELEASE>>",    time,                              text)
          text = re.sub(r"<<REASONFORRELEASE>>", "Scheduled update",                text)
          text = re.sub(r"<<WSAANDROIDVERSION>>","Android 13",                     text)
          text = re.sub(r"<<MAGISKSTABLEVERSION>>",
                        os.environ.get("MAGISK_STABLE_MSG", "").replace("\\", ""), text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print("Release notes updated.")

      - name: Upload Release Notes 📤
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: Windows11x64.md

  # ---------------------------------------------------------------------------
  # build-and-publish-release — dispatch production release pipeline
  # ---------------------------------------------------------------------------
  build-and-publish-release:
    name: Build & Publish — WSA x64 Magisk Stable + Pico GApps
    permissions:
      contents: write
    needs: [check, update-downloadlinks, prepare-release]
    if: inputs.wsa_ver != '' || needs.check.outputs.RETAIL_UPDATE == 'yes'

    uses: ./.github/workflows/release.yml
    with:
      wsa_ver:     ${{ inputs.wsa_ver || needs.check.outputs.LATEST_RETAIL_VER }}
      wsa_message: ${{ inputs.wsa_message || format('Windows Subsystem For Android {0} for Windows 11 x64', inputs.wsa_ver || needs.check.outputs.LATEST_RETAIL_VER) }}
      variant:     'Magisk_GApps_Retail_x64'
      tag_name:    'Windows_11_${{ inputs.wsa_ver || needs.check.outputs.LATEST_RETAIL_VER }}'
    secrets: inherit
