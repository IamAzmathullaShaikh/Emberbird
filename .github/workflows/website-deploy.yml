name: Website Deployment & Validation

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'compatibility/**'
      - 'services/analytics/**'
  pull_request:
    branches: [main, master, experimental]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'compatibility/**'
      - 'services/analytics/**'
  workflow_dispatch:

concurrency:
  group: website-val-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  validate-and-deploy:
    name: Validate, Typecheck & Deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag head 2026-09-14
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'website/package.json'

      - name: Install Dependencies
        working-directory: website
        run: |
          npm install

      - name: Dependency Security Audit
        working-directory: website
        run: |
          echo "[*] Running npm dependency audit for critical vulnerabilities..."
          npm audit --audit-level=critical

      - name: Execute Unit Test Suite
        working-directory: website
        run: |
          echo "[*] Executing parser, compatibility, environment, and wizard diagnostic test suites..."
          npm run test

      - name: TypeScript Type Checking
        working-directory: website
        run: |
          echo "[*] Executing TypeScript typecheck..."
          # Rule 20: gate is enforced. Fix any TS errors before deploying.
          npm run typecheck

      - name: Prebuild Documentation Import
        working-directory: website
        run: |
          echo "[*] Syncing documentation into content collection..."
          npm run prebuild

      - name: Build Static Site & Search Index
        working-directory: website
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://wsabuilds-website.pages.dev' }}
          PUBLIC_GITHUB_REPO: ${{ github.repository }}
          PUBLIC_GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PUBLIC_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          npm run build

      - name: Verify Build Output & Search Index
        working-directory: website
        run: |
          if [ ! -d "dist" ]; then
            echo "[-] Build failed: dist directory not found."
            exit 1
          fi
          echo "[+] Build output verified in website/dist/."
          
          if [ -d "dist/pagefind" ]; then
            echo "[+] Pagefind search index validated successfully in website/dist/pagefind/."
          else
            echo "[!] Pagefind directory not generated (post-build indexing optional in non-production runs)."
          fi

      - name: Check Cloudflare Configuration
        id: cfconfig
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "configured=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "[!] Cloudflare secrets not configured - deploy step will be skipped."
            echo "    Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets to activate."
          fi

      - name: Deploy to Cloudflare Pages
        if: >-
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
          github.event_name != 'pull_request' &&
          steps.cfconfig.outputs.configured == 'true'
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca # v1.5.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'wsabuilds-website'
          directory: 'website/dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
