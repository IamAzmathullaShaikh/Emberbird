name: Emberbird Manager CI

on:
  push:
    branches: [master, main, experimental, feature/*]
    paths:
      - 'apps/manager/**'
      - '.github/workflows/manager-build.yml'
  pull_request:
    branches: [master, main, experimental]
    paths:
      - 'apps/manager/**'
      - '.github/workflows/manager-build.yml'
  workflow_dispatch:

concurrency:
  group: manager-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-manager:
    name: Build, Typecheck & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14
        with:
          fetch-depth: 1

      - name: Setup Node.js 24 (type-stripping for .ts test imports)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag head 2026-09-14
        with:
          node-version: 24

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: 'apps/manager/src-tauri'

      - name: Install Frontend Dependencies
        working-directory: apps/manager
        run: |
          npm install

      - name: Frontend Contract Test Suite
        working-directory: apps/manager
        run: |
          echo "[*] Executing manager frontend contract tests (node --test)..."
          npm run test

      - name: Frontend Component Test Suite (Vitest + RTL)
        working-directory: apps/manager
        run: |
          echo "[*] Executing manager component tests (vitest)..."
          npm run test:components

      - name: Frontend TypeScript Type Checking
        working-directory: apps/manager
        run: |
          echo "[*] Executing manager TypeScript typecheck..."
          npm run typecheck

      - name: TypeScript and React Lint
        run: npm run lint
        working-directory: apps/manager
        continue-on-error: true
        # [ADVISORY] until lint baseline is clean

      - name: Python Lint (ruff)
        run: |
          pip install ruff --quiet
          ruff check scripts/ tests/ --exit-zero
        # [ADVISORY] Rule 20: running ruff in advisory mode until baseline is established.
        # Remove --exit-zero once all scripts are clean.

      - name: Cargo Check
        working-directory: apps/manager/src-tauri
        run: |
          echo "[*] Running cargo check on native desktop engine..."
          cargo check

      - name: Cargo Clippy
        working-directory: apps/manager/src-tauri
        run: |
          echo "[*] Running cargo clippy linter..."
          cargo clippy -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: apps/manager/src-tauri

      - name: Cargo Test Suite
        working-directory: apps/manager/src-tauri
        run: |
          echo "[*] Running native Rust unit tests..."
          cargo test --verbose

      - name: Tauri Build (NSIS packaging gate)
        # QG-0: Catch packaging failures in CI, not at release time.
        # This builds the full Tauri app including NSIS installer.
        working-directory: apps/manager
        run: |
          echo "[*] Building Tauri application (NSIS packaging gate)..."
          npx tauri build --bundles nsis

      - name: Verification Summary
        run: |
          echo "[+] WSABuilds Manager validation suite passed successfully."
