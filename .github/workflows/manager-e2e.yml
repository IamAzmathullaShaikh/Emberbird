name: Emberbird Manager E2E Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/manager/**'
  workflow_dispatch:

concurrency:
  group: manager-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests (Windows, Tauri WebView2 over CDP)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: 'apps/manager/src-tauri'

      - name: Install Frontend Dependencies
        working-directory: apps/manager
        run: npm ci

      # WebView2 drives the window under test. windows-latest images usually
      # ship the Evergreen Runtime, but its absence would surface as a dead
      # attach far into the run — detect it up front and install it if missing.
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $present = $false
          foreach ($k in $keys) {
            if (Test-Path $k) {
              $pv = (Get-ItemProperty -Path $k).pv
              Write-Host "WebView2 Runtime present: $k (pv=$pv)"
              $present = $true
              break
            }
          }
          if (-not $present) {
            Write-Host 'WebView2 Runtime not found - installing the Evergreen Bootstrapper...'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile MicrosoftEdgeWebview2Setup.exe
            $p = Start-Process -FilePath './MicrosoftEdgeWebview2Setup.exe' -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "WebView2 Runtime install failed with exit code $($p.ExitCode)" }
            Write-Host 'WebView2 Runtime installed.'
          }

      # --no-bundle: the E2E gate tests the application, not the NSIS
      # installer (manager-build.yml packages it). Skips minutes of bundling
      # and removes an installer failure mode from this gate. The CLI enables
      # the custom-protocol feature, so the binary embeds the frontend assets.
      - name: Build Tauri App (release, no installer bundle)
        working-directory: apps/manager
        run: npx tauri build --no-bundle

      # The suite drives the compiled application's WebView2 window over CDP.
      # It does not need tauri-driver (WebDriver, which Playwright cannot speak)
      # nor a bundled Chromium, so neither is installed.
      - name: Run E2E Tests
        working-directory: apps/manager
        run: npm run test:e2e

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: apps/manager/e2e-report/
          retention-days: 7
