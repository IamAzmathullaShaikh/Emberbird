name: Emberbird Manager E2E Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/manager/**'
  workflow_dispatch:

concurrency:
  group: manager-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests (Windows, Tauri WebDriver)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: 'apps/manager/src-tauri'

      - name: Install Frontend Dependencies
        working-directory: apps/manager
        run: npm install

      - name: Build Tauri App (release)
        working-directory: apps/manager
        run: npx tauri build

      - name: Install Tauri WebDriver
        run: cargo install tauri-driver

      - name: Install Playwright Chromium
        working-directory: apps/manager
        run: npx playwright install chromium

      - name: Run E2E Tests
        working-directory: apps/manager
        run: npm run test:e2e

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: apps/manager/e2e-report/
          retention-days: 7
