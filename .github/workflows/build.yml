name: Build & CI Verification Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      wsa_ver:
        description: 'WSA Version override'
        type: string
        required: false
      wsa_message:
        description: 'Human-readable release note'
        type: string
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Code Quality, Linters & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp
          sudo mv /tmp/actionlint /usr/local/bin/actionlint

      - name: Run actionlint 🔍
        run: actionlint

      - name: Install ShellCheck 🐚
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -x -S warning --exclude=SC2034,SC2174 \
            MagiskOnWSA/scripts/*.sh \
            MagiskOnWSA/libhoudini/houdini_installer.sh \
            MagiskOnWSAOld/scripts/*.sh \
            MagiskOnWSAOld/libhoudini/houdini_installer.sh

      - name: Compile Python sources ⚙️
        run: |
          python3 -m compileall -q \
            scripts \
            config \
            tests \
            MagiskOnWSA/scripts \
            "MagiskOnWSA/Update Check" \
            MagiskOnWSAOld/scripts \
            "WSABuilds Utilities/Update Script" \
            "WSABuilds Utilities/Uninstall Script"

      - name: Install Test Dependencies 📦
        run: |
          pip3 install --quiet -r MagiskOnWSA/scripts/requirements.txt

      - name: Run Offline Unit Test Suite 🧪
        run: |
          python3 -m unittest discover -s tests -v

  verify-package-identity:
    name: Package Identity Regression Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Package Identity Baseline
        run: |
          python3 scripts/validate_package_identity.py --baseline config/baseline-identity.json

      - name: Archive Identity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-identity-report
          path: package-identity-report.json
          if-no-files-found: ignore
