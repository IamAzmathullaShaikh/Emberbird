name: WSA Validation Suite

on:
  workflow_dispatch:
    inputs:
      run_live_adb:
        description: 'Execute live ADB diagnostics on connected runner'
        type: boolean
        default: false
      runner_label:
        description: 'Runner label for live lab validation'
        type: string
        default: 'windows-latest'
  schedule:
    - cron: '0 4 * * 0' # Weekly Sunday run
  workflow_call:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-subsystem-validation:
    name: Offline Subsystem Integrity & Manifest Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14

      - name: Setup Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Package Identity Validation
        run: |
          python3 scripts/validate_package_identity.py --baseline config/baseline-identity.json

      - name: Structural Package Integrity Validation
        run: |
          python3 scripts/validate_package_integrity.py

      - name: Magisk Trampoline Inspection
        run: |
          python3 scripts/validate_magisk.py

      - name: GApps Overlay Inspection
        run: |
          python3 scripts/validate_gapps.py

      - name: Archive Offline Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-validation-reports
          path: |
            package-identity-report.json
            package-integrity-report.json
            magisk-validation-report.json
            gapps-validation-report.json
          if-no-files-found: ignore

  live-runner-validation:
    name: Live Windows Lab ADB & Upgrade Validation
    needs: offline-subsystem-validation
    if: inputs.run_live_adb == true
    runs-on: ${{ inputs.runner_label || 'windows-latest' }}
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14

      - name: Setup Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Execute Upgrade Compatibility Harness
        run: |
          powershell.exe -ExecutionPolicy Bypass -File scripts/validate_upgrade.ps1

      - name: Live Magisk Root Diagnostics
        run: |
          python scripts/validate_magisk.py --live

      - name: Live GApps Package Registration Diagnostics
        run: |
          python scripts/validate_gapps.py --live

      - name: Archive Live Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-validation-reports
          path: |
            upgrade-validation-report.json
            magisk-validation-report.json
            gapps-validation-report.json
          if-no-files-found: ignore
