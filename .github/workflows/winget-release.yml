name: Winget Distribution & Packaging CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version tag to package and validate (e.g. 0.2.0)'
        required: false
        default: '0.2.0'
      dry_run:
        description: 'Dry run execution (do not publish external artifacts)'
        required: false
        type: boolean
        default: false

concurrency:
  group: winget-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  APP_DIR: apps/manager
  TAURI_DIR: apps/manager/src-tauri

jobs:
  validate-metadata:
    name: Validate Distribution & Winget Manifests
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Execute Distribution Validator
        run: |
          echo "[*] Running distribution metadata & Winget manifest validation suite..."
          python scripts/validate_distribution.py

  package-manager:
    name: Package Desktop Release & Checksums
    needs: validate-metadata
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 tag head 2026-09-14
        with:
          node-version: 20

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-03
        with:
          toolchain: '1.98.1'
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          workspaces: 'apps/manager/src-tauri'

      - name: Verify Tag Matches Declared Version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content deployment/version.json | ConvertFrom-Json).manager.version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -ne $tag) {
            Write-Host "[!] FATAL: Tag v$tag does not match declared manager version $ver in deployment/version.json."
            Write-Host "    Update deployment/version.json (and package.json / Cargo.toml / tauri.conf.json) before tagging."
            exit 1
          }
          Write-Host "[+] Tag v$tag matches declared manager version."

      - name: Install Frontend Dependencies
        working-directory: apps/manager
        shell: bash
        run: |
          echo "[*] Installing frontend dependencies (npm ci)..."
          npm ci
          echo "[+] npm ci completed"

      - name: TypeScript Check
        working-directory: apps/manager
        shell: bash
        run: |
          echo "[*] TypeScript version: $(npx tsc --version)"
          npx tsc --noEmit
          echo "[+] TypeScript check passed"

      - name: Tauri Build (NSIS Installer + Release Binary)
        working-directory: apps/manager
        env:
          NODE_ENV: production
          VITE_PUBLIC_GITHUB_REPO: IamAzmathullaShaikh/WSABuilds
          VITE_PUBLIC_GITHUB_REPO_URL: https://github.com/IamAzmathullaShaikh/WSABuilds
          VITE_PUBLIC_RELEASES_URL: https://github.com/IamAzmathullaShaikh/WSABuilds/releases
        shell: bash
        run: |
          echo "[*] Running npx tauri build (runs beforeBuildCommand: npm run build, then cargo build + NSIS bundling)..."
          npx tauri build --bundles nsis
          echo "[+] Tauri build completed"

      - name: Commit Cargo.lock (Reproducibility)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $lock = "apps/manager/src-tauri/Cargo.lock"
          if (Test-Path $lock) {
            Write-Host "[+] Cargo.lock generated by this build: $((Get-Item $lock).Length) bytes"
            Get-Content $lock -TotalCount 8
            Write-Host "[i] Artifact 'cargo-lock' attached for maintainer to commit."
          } else {
            Write-Host "[!] FATAL: Cargo.lock was not generated."
            exit 1
          }

      - name: Stage Artifacts & Checksums
        shell: pwsh
        run: |
          $ver = (Get-Content deployment/version.json | ConvertFrom-Json).manager.version
          New-Item -ItemType Directory -Force -Path "dist_artifacts" | Out-Null

          $bin = "apps/manager/src-tauri/target/release/wsabuilds-manager.exe"
          if (-not (Test-Path $bin)) {
            Write-Host "[!] FATAL: Release binary not found at $bin"
            Get-ChildItem -Recurse apps/manager/src-tauri/target/release -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
            exit 1
          }
          Copy-Item $bin "dist_artifacts/wsabuilds-manager.exe"

          # Portable archive: binary + LICENSE
          Compress-Archive -Path "dist_artifacts/wsabuilds-manager.exe", "LICENSE" -DestinationPath "dist_artifacts/WSABuildsManager-Portable-$ver-x64.zip"

          # NSIS installer: REQUIRED, no fallback to raw binary
          $nsisInstaller = Get-ChildItem -Path "apps/manager/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsisInstaller) {
            Write-Host "[!] FATAL: NSIS installer not found in bundle directory."
            Get-ChildItem -Recurse apps/manager/src-tauri/target/release/bundle -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
            exit 1
          }
          Copy-Item $nsisInstaller.FullName "dist_artifacts/WSABuildsManager-Setup-$ver-x64.exe"

          # SHA256 checksums + sidecars
          $portableHash = (Get-FileHash "dist_artifacts/WSABuildsManager-Portable-$ver-x64.zip" -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash "dist_artifacts/WSABuildsManager-Setup-$ver-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$portableHash *WSABuildsManager-Portable-$ver-x64.zip" | Out-File -Encoding ascii "dist_artifacts/WSABuildsManager-Portable-$ver-x64.zip.sha256"
          "$setupHash *WSABuildsManager-Setup-$ver-x64.exe" | Out-File -Encoding ascii "dist_artifacts/WSABuildsManager-Setup-$ver-x64.exe.sha256"
          @(
            "$setupHash *WSABuildsManager-Setup-$ver-x64.exe",
            "$portableHash *WSABuildsManager-Portable-$ver-x64.zip"
          ) | Out-File -Encoding ascii "dist_artifacts/WSABuildsManager-$ver-checksums.txt"

          # Build Reality Gate: reject stubs/text files masquerading as executables
          Write-Host "[+] Artifact validation:"
          $staging = "dist_artifacts/wsabuilds-manager.exe"
          $setup = "dist_artifacts/WSABuildsManager-Setup-$ver-x64.exe"
          $failures = @()
          foreach ($f in @($staging, $setup)) {
            $bytes = [System.IO.File]::ReadAllBytes($f)[0..1]
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              $failures += "$($f): missing MZ/PE header"
            }
            if ($f -eq $setup -and (Get-Item $f).Length -lt 1MB) {
              $failures += "$($f): NSIS installer suspiciously small ($((Get-Item $f).Length) bytes)"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "[!] REALITY GATE FAILURE: $_" }
            exit 1
          }
          Get-ChildItem dist_artifacts | ForEach-Object {
            Write-Host "    - $($_.Name): $($_.Length) bytes"
          }
          Write-Host "[+] Reality Gate passed: both executables are real PE binaries."

      - name: Upload Packaging Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manager-release-artifacts
          path: dist_artifacts/*
          retention-days: 7
          if-no-files-found: error

      - name: Upload Cargo.lock (for maintainers to commit)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-lock
          path: apps/manager/src-tauri/Cargo.lock
          retention-days: 30
          if-no-files-found: error

  sign-release:
    name: Sign Release Binaries (Azure Trusted Signing)
    needs: package-manager
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    outputs:
      signed: ${{ steps.rehash.outputs.signed }}

    steps:
      - name: Download Packaging Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manager-release-artifacts
          path: sign_assets

      - name: Evaluate Signing Configuration (guard)
        # The secrets context is not available in job-level if: expressions,
        # so availability is evaluated here and branched on below. When the
        # five secrets are absent the pipeline publishes unsigned — exactly
        # as it does today — never failing the release.
        id: signcfg
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERT_PROFILE_NAME: ${{ secrets.AZURE_SIGNING_CERT_PROFILE_NAME }}
        run: |
          $required = @('AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_SIGNING_ACCOUNT_NAME','AZURE_SIGNING_CERT_PROFILE_NAME')
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            Write-Host "[i] Azure Trusted Signing not configured; missing secrets: $($missing -join ', ')."
            Write-Host "[i] Publishing unsigned artifacts (SmartScreen 'Unknown publisher' until signing is provisioned)."
            "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "[+] Azure Trusted Signing secrets present; signing enabled."
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Sign Artifacts (Azure Trusted Signing)
        if: steps.signcfg.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          azure-certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERT_PROFILE_NAME }}
          files-folder: sign_assets
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          operation-timeout: 900

      - name: Re-hash Signed Artifacts & Regenerate Checksums
        # Signing rewrites the PE bytes (signature is embedded), so every
        # hash MUST be recomputed after signing. The winget manifest bootstrap
        # (scripts/bootstrap_winget.py) reads these checksums, so the manifest
        # hash always ends up describing the signed bytes users download.
        id: rehash
        shell: pwsh
        run: |
          $ver = (Get-Content deployment/version.json -ErrorAction SilentlyContinue | ConvertFrom-Json).manager.version
          if (-not $ver) { $ver = "${{ github.ref_name }}".TrimStart('v') }
          $setup = "sign_assets/WSABuildsManager-Setup-$ver-x64.exe"
          $portable = "sign_assets/WSABuildsManager-Portable-$ver-x64.zip"
          $signed = "false"
          if (Test-Path $setup) {
            $sig = Get-AuthenticodeSignature $setup
            if ($sig.SignerCertificate) {
              Write-Host "[+] Authenticode: $($sig.Status) | Subject=$($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne 'Valid') { Write-Host "[!] FATAL: signature status is $($sig.Status)."; exit 1 }
              $signed = "true"
            } else {
              Write-Host "[i] No Authenticode certificate present (signing disabled or skipped)."
            }
            # MZ Reality Gate still applies post-signing.
            $bytes = [System.IO.File]::ReadAllBytes($setup)[0..1]
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { Write-Host "[!] FATAL: signed setup lost PE header."; exit 1 }
          } else {
            Write-Host "[!] FATAL: setup artifact missing in sign_assets."; exit 1
          }
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$setupHash *WSABuildsManager-Setup-$ver-x64.exe" | Out-File -Encoding ascii "sign_assets/WSABuildsManager-Setup-$ver-x64.exe.sha256"
          if (Test-Path $portable) {
            $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
            "$portableHash *WSABuildsManager-Portable-$ver-x64.zip" | Out-File -Encoding ascii "sign_assets/WSABuildsManager-Portable-$ver-x64.zip.sha256"
            @(
              "$setupHash *WSABuildsManager-Setup-$ver-x64.exe",
              "$portableHash *WSABuildsManager-Portable-$ver-x64.zip"
            ) | Out-File -Encoding ascii "sign_assets/WSABuildsManager-$ver-checksums.txt"
          }
          Write-Host "[+] Post-signing hashes recomputed: setup=$setupHash"
          "signed=$signed" >> $env:GITHUB_OUTPUT

      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manager-release-artifacts
          path: sign_assets/*
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  publish-manager-release:
    name: Publish GitHub Release
    needs: [package-manager, sign-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Packaging Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manager-release-artifacts
          path: release_assets

      - name: Report Signing State
        shell: pwsh
        run: |
          Write-Host "[i] Release signing state: ${{ needs.sign-release.outputs.signed }}"

      - name: Verify Artifact Integrity (re-hash published assets)
        shell: pwsh
        run: |
          # Runtime Reality Gate: independently re-hash downloaded artifacts and
          # compare against the checksums manifest before publishing. When the
          # signing stage ran, these are the SIGNED bytes and the regenerated
          # checksums manifest — the pair stays internally consistent.
          $expected = @{}
          Get-Content release_assets/WSABuildsManager-*-checksums.txt | ForEach-Object {
            if ($_ -match '^([a-f0-9]{64}) \*(.+)$') { $expected[$Matches[2]] = $Matches[1] }
          }
          if ($expected.Count -lt 2) {
            Write-Host "[!] FATAL: checksums manifest incomplete ($($expected.Count) entries)."
            exit 1
          }
          $failed = $false
          foreach ($name in $expected.Keys) {
            $path = Join-Path "release_assets" $name
            if (-not (Test-Path $path)) {
              Write-Host "[!] REALITY GATE FAILURE: $name listed in checksums but missing from artifacts."
              $failed = $true; continue
            }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected[$name]) {
              Write-Host "[!] REALITY GATE FAILURE: $name hash mismatch (expected $($expected[$name]), got $actual)."
              $failed = $true
            } else {
              Write-Host "[+] ${name}: hash verified."
            }
          }
          if ($failed) { exit 1 }
          Write-Host "[+] All publish assets re-verified against checksums manifest."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: WSABuilds Manager ${{ github.ref_name }}
          files: |
            release_assets/WSABuildsManager-*.zip
            release_assets/WSABuildsManager-*.exe
            release_assets/WSABuildsManager-*.txt
            release_assets/WSABuildsManager-*.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          overwrite_files: true
          make_latest: false

  prepare-winget:
    name: Prepare Winget Release Manifests
    needs: validate-metadata
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14
        with:
          fetch-depth: 1

      - name: Archive Winget Manifest Bundle
        shell: pwsh
        run: |
          $ver = (Get-Content deployment/version.json | ConvertFrom-Json).manager.version
          New-Item -ItemType Directory -Force -Path "winget_bundle" | Out-Null
          Copy-Item -Recurse "manifests/w/WSABuilds/WSABuildsManager/$ver" "winget_bundle/"
          Write-Host "[+] Prepared Winget manifests bundle for v$ver."

      - name: Upload Winget Manifest Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winget-manifests
          path: winget_bundle/**
          retention-days: 14
