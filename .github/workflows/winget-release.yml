name: Winget Distribution & Packaging CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version tag to package and validate (e.g. 0.2.0)'
        required: false
        default: '0.2.0'
      dry_run:
        description: 'Dry run execution (do not publish external artifacts)'
        required: false
        type: boolean
        default: false

concurrency:
  group: winget-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  APP_DIR: apps/manager
  TAURI_DIR: apps/manager/src-tauri

jobs:
  validate-metadata:
    name: Validate Distribution & Winget Manifests
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Execute Distribution Validator
        run: |
          echo "[*] Running distribution metadata & Winget manifest validation suite..."
          python scripts/validate_distribution.py

  package-manager:
    name: Package Desktop Release & Checksums
    needs: validate-metadata
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/manager/src-tauri'

      - name: Verify Tag Matches Declared Version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content deployment/version.json | ConvertFrom-Json).manager.version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -ne $tag) {
            Write-Host "[!] FATAL: Tag v$tag does not match declared manager version $ver in deployment/version.json."
            Write-Host "    Update deployment/version.json (and package.json / Cargo.toml / tauri.conf.json) before tagging."
            exit 1
          }
          Write-Host "[+] Tag v$tag matches declared manager version."

      - name: Install Frontend Dependencies
        working-directory: apps/manager
        shell: bash
        run: |
          echo "[*] Installing frontend dependencies (npm ci)..."
          npm ci
          echo "[+] npm ci completed"

      - name: TypeScript Check
        working-directory: apps/manager
        shell: bash
        run: |
          echo "[*] TypeScript version: $(npx tsc --version)"
          npx tsc --noEmit
          echo "[+] TypeScript check passed"

      - name: Tauri Build (NSIS Installer + Release Binary)
        working-directory: apps/manager
        env:
          NODE_ENV: production
          VITE_PUBLIC_GITHUB_REPO: IamAzmathullaShaikh/WSABuilds
          VITE_PUBLIC_GITHUB_REPO_URL: https://github.com/IamAzmathullaShaikh/WSABuilds
          VITE_PUBLIC_RELEASES_URL: https://github.com/IamAzmathullaShaikh/WSABuilds/releases
        shell: bash
        run: |
          echo "[*] Running npx tauri build (runs beforeBuildCommand: npm run build, then cargo build + NSIS bundling)..."
          npx tauri build --bundles nsis
          echo "[+] Tauri build completed"

      - name: Stage Artifacts & Checksums
        shell: pwsh
        run: |
          $ver = (Get-Content deployment/version.json | ConvertFrom-Json).manager.version
          New-Item -ItemType Directory -Force -Path "dist_artifacts" | Out-Null

          $bin = "apps/manager/src-tauri/target/release/wsabuilds-manager.exe"
          if (-not (Test-Path $bin)) {
            Write-Host "[!] FATAL: Release binary not found at $bin"
            Get-ChildItem -Recurse apps/manager/src-tauri/target/release -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
            exit 1
          }
          Copy-Item $bin "dist_artifacts/wsabuilds-manager.exe"

          # Portable archive: binary + LICENSE
          Compress-Archive -Path "dist_artifacts/wsabuilds-manager.exe", "LICENSE" -DestinationPath "dist_artifacts/WSABuildsManager-Portable-$ver-x64.zip"

          # NSIS installer: REQUIRED, no fallback to raw binary
          $nsisInstaller = Get-ChildItem -Path "apps/manager/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsisInstaller) {
            Write-Host "[!] FATAL: NSIS installer not found in bundle directory."
            Get-ChildItem -Recurse apps/manager/src-tauri/target/release/bundle -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
            exit 1
          }
          Copy-Item $nsisInstaller.FullName "dist_artifacts/WSABuildsManager-Setup-$ver-x64.exe"

          # SHA256 checksums + sidecars
          $portableHash = (Get-FileHash "dist_artifacts/WSABuildsManager-Portable-$ver-x64.zip" -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash "dist_artifacts/WSABuildsManager-Setup-$ver-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$portableHash *WSABuildsManager-Portable-$ver-x64.zip" | Out-File -Encoding ascii "dist_artifacts/WSABuildsManager-Portable-$ver-x64.zip.sha256"
          "$setupHash *WSABuildsManager-Setup-$ver-x64.exe" | Out-File -Encoding ascii "dist_artifacts/WSABuildsManager-Setup-$ver-x64.exe.sha256"
          @(
            "$setupHash *WSABuildsManager-Setup-$ver-x64.exe",
            "$portableHash *WSABuildsManager-Portable-$ver-x64.zip"
          ) | Out-File -Encoding ascii "dist_artifacts/WSABuildsManager-$ver-checksums.txt"

          # Build Reality Gate: reject stubs/text files masquerading as executables
          Write-Host "[+] Artifact validation:"
          $staging = "dist_artifacts/wsabuilds-manager.exe"
          $setup = "dist_artifacts/WSABuildsManager-Setup-$ver-x64.exe"
          $failures = @()
          foreach ($f in @($staging, $setup)) {
            $bytes = [System.IO.File]::ReadAllBytes($f)[0..1]
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              $failures += "$($f): missing MZ/PE header"
            }
            if ($f -eq $setup -and (Get-Item $f).Length -lt 1MB) {
              $failures += "$($f): NSIS installer suspiciously small ($((Get-Item $f).Length) bytes)"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "[!] REALITY GATE FAILURE: $_" }
            exit 1
          }
          Get-ChildItem dist_artifacts | ForEach-Object {
            Write-Host "    - $($_.Name): $($_.Length) bytes"
          }
          Write-Host "[+] Reality Gate passed: both executables are real PE binaries."

      - name: Upload Packaging Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manager-release-artifacts
          path: dist_artifacts/*
          retention-days: 7
          if-no-files-found: error

  publish-manager-release:
    name: Publish GitHub Release
    needs: package-manager
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Packaging Artifacts
        uses: actions/download-artifact@v4
        with:
          name: manager-release-artifacts
          path: release_assets

      - name: Verify Artifact Integrity (re-hash published assets)
        shell: pwsh
        run: |
          # Runtime Reality Gate: independently re-hash downloaded artifacts and
          # compare against the checksums manifest before publishing.
          $expected = @{}
          Get-Content release_assets/WSABuildsManager-*-checksums.txt | ForEach-Object {
            if ($_ -match '^([a-f0-9]{64}) \*(.+)$') { $expected[$Matches[2]] = $Matches[1] }
          }
          if ($expected.Count -lt 2) {
            Write-Host "[!] FATAL: checksums manifest incomplete ($($expected.Count) entries)."
            exit 1
          }
          $failed = $false
          foreach ($name in $expected.Keys) {
            $path = Join-Path "release_assets" $name
            if (-not (Test-Path $path)) {
              Write-Host "[!] REALITY GATE FAILURE: $name listed in checksums but missing from artifacts."
              $failed = $true; continue
            }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected[$name]) {
              Write-Host "[!] REALITY GATE FAILURE: $name hash mismatch (expected $($expected[$name]), got $actual)."
              $failed = $true
            } else {
              Write-Host "[+] $name: hash verified."
            }
          }
          if ($failed) { exit 1 }
          Write-Host "[+] All publish assets re-verified against checksums manifest."
        with:
          tag_name: ${{ github.ref_name }}
          name: WSABuilds Manager ${{ github.ref_name }}
          files: |
            release_assets/*.zip
            release_assets/*.exe
            release_assets/*.txt
            release_assets/*.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          overwrite_files: true

  prepare-winget:
    name: Prepare Winget Release Manifests
    needs: validate-metadata
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Archive Winget Manifest Bundle
        shell: pwsh
        run: |
          $ver = (Get-Content deployment/version.json | ConvertFrom-Json).manager.version
          New-Item -ItemType Directory -Force -Path "winget_bundle" | Out-Null
          Copy-Item -Recurse "manifests/w/WSABuilds/WSABuildsManager/$ver" "winget_bundle/"
          Write-Host "[+] Prepared Winget manifests bundle for v$ver."

      - name: Upload Winget Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: winget_bundle/**
          retention-days: 14
