name: Documentation Quality & Link Integrity

on:
  push:
    paths:
      - '**.md'
      - 'docs/**'
      - 'Documentation/**'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'Documentation/**'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-documentation:
    name: Markdown & Local Link Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Local Markdown Links 🔗
        run: |
          python3 scripts/check_doc_links.py
