name: Documentation Validation

on:
  push:
    branches: [master, main, experimental, 'feature/*']
    paths:
      - 'docs/**'
      - 'Documentation/**'
      - '*.md'
      - '.github/**/*.md'
  pull_request:
    branches: [master, main, experimental, 'feature/*']
    paths:
      - 'docs/**'
      - 'Documentation/**'
      - '*.md'
      - '.github/**/*.md'
  workflow_dispatch:

concurrency:
  group: docs-val-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate Markdown Links & Security
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14
        with:
          fetch-depth: 1

      - name: Set up Python Environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check Markdown Local Links
        run: |
          echo "[*] Auditing local markdown links across repository..."
          python scripts/check_doc_links.py

      - name: Security & Secret Scan
        run: |
          echo "[*] Auditing repository documentation for credentials and machine paths..."
          python scripts/security_scan.py

      - name: Validation Complete
        run: |
          echo "[+] Documentation validation passed successfully with 0 broken links and clean security audit."
