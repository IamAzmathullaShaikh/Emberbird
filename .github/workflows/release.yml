name: Production Release Pipeline

on:
  push:
    tags:
      - 'Windows_*'
      - 'wsa-v*'
  workflow_dispatch:
    inputs:
      wsa_ver:
        description: 'WSA Version (optional, e.g. 2407.40000.4.0)'
        required: false
      variant:
        description: 'Target Variant Name'
        required: false
        default: 'Magisk_GApps_Retail_x64'
  workflow_call:
    inputs:
      wsa_ver:
        description: 'WSA Version (optional, e.g. 2407.40000.4.0)'
        type: string
        required: false
      wsa_message:
        description: 'Release note message or title'
        type: string
        required: false
      variant:
        description: 'Target Variant Name'
        type: string
        required: false
        default: 'Magisk_GApps_Retail_x64'
      tag_name:
        description: 'Target Release Tag Name'
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-quality-gates:
    name: Verify Quality & Identity Baseline Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14

      - name: Setup Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Validate Identity Baseline Schema
        run: |
          python3 scripts/validate_package_identity.py --baseline config/baseline-identity.json

      - name: Compile Python sources ⚙️
        run: |
          python3 -m compileall -q \
            scripts \
            config \
            tests \
            MagiskOnWSA/scripts \
            "MagiskOnWSA/Update Check" \
            "WSABuilds Utilities/Update Script" \
            "WSABuilds Utilities/Uninstall Script"

      - name: Install Test Dependencies 📦
        run: |
          pip3 install --quiet -r MagiskOnWSA/scripts/requirements.txt

      - name: Run Unit Tests 🧪
        run: |
          python3 -m unittest discover -s tests -v

  build-release-package:
    name: Build WSA Package (${{ matrix.edition_name }})
    needs: verify-quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - root_sol: magisk
            gapps: pico
            edition_name: Standard Edition (x64 Magisk + Pico)
            artifact_key: standard
          - root_sol: none
            gapps: pico
            edition_name: Banking Edition (x64 Vanilla + Pico)
            artifact_key: vanilla
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14

      - name: Setup Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Maximize Runner Disk Space 🧹
        run: |
          echo "[*] Freeing runner storage space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full unzip

      - name: Install Python Requirements
        run: |
          pip3 install --quiet -r MagiskOnWSA/scripts/requirements.txt

      - name: Execute WSA Core Build Script ⚙️
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd MagiskOnWSA/scripts
          bash build.sh --root-sol ${{ matrix.root_sol }} --gapps ${{ matrix.gapps }} --compress-format 7z

      - name: Compress Release Distribution (.7z) 🗜️
        run: |
          PKG_DIR=$(find MagiskOnWSA/output -maxdepth 1 -type d -name "WSA_*" | head -n 1)
          if [ -n "$PKG_DIR" ]; then
            PKG_NAME=$(basename "$PKG_DIR")
            if [ ! -f "MagiskOnWSA/output/${PKG_NAME}.7z" ]; then
              echo "[*] Compressing $PKG_NAME into 7z archive..."
              (cd MagiskOnWSA/output && 7z a -mx=7 "${PKG_NAME}.7z" "${PKG_NAME}")
            fi
          fi

      - name: Archive Built Packages 📦
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wsa-built-distribution-${{ matrix.artifact_key }}
          path: |
            MagiskOnWSA/output/*.7z
            MagiskOnWSA/output/WSA_*/AppxManifest.xml
            MagiskOnWSA/output/WSA_*/Install.ps1
            MagiskOnWSA/output/WSA_*/Run.bat
            MagiskOnWSA/output/WSA_*/Tools/initrd.img
          retention-days: 2

  validate-and-publish:
    name: Validate, Hash & Publish Release
    needs: build-release-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag head 2026-09-14

      - name: Setup Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install Extraction Tools 🗜️
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download Built Package Artifacts 📥
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wsa-built-distribution-*
          path: MagiskOnWSA/output
          merge-multiple: true

      - name: Download Release Notes 📝
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: release-notes
          path: .

      - name: Extract Distribution Archives for Verification 🗜️
        run: |
          for ARCHIVE in MagiskOnWSA/output/*.7z; do
            if [ -f "$ARCHIVE" ]; then
              echo "[*] Unpacking $ARCHIVE for deep partition integrity validation..."
              7z x "$ARCHIVE" -oMagiskOnWSA/output/ -y
            fi
          done

      - name: Validate Package Structural Integrity
        run: |
          for PKG_DIR in MagiskOnWSA/output/WSA_*/; do
            if [ -d "$PKG_DIR" ]; then
              PKG_BASE=$(basename "$PKG_DIR")
              EDITION="standard"
              if [[ "$PKG_BASE" =~ [Vv]anilla ]]; then EDITION="vanilla"; fi
              echo "[*] Validating structural integrity for $EDITION: $PKG_DIR"
              python3 scripts/validate_package_integrity.py --package-dir "$PKG_DIR" --require-package --output-report "package-integrity-report-${EDITION}.json"
              cp "package-integrity-report-${EDITION}.json" "package-integrity-report.json" || true
            fi
          done

      - name: Validate Package Identity
        run: |
          for PKG_DIR in MagiskOnWSA/output/WSA_*/; do
            if [ -d "$PKG_DIR" ]; then
              PKG_BASE=$(basename "$PKG_DIR")
              EDITION="standard"
              if [[ "$PKG_BASE" =~ [Vv]anilla ]]; then EDITION="vanilla"; fi
              echo "[*] Validating package identity for $EDITION: $PKG_DIR"
              python3 scripts/validate_package_identity.py --package-dir "$PKG_DIR" --require-manifest --output-report "package-identity-report-${EDITION}.json"
              cp "package-identity-report-${EDITION}.json" "package-identity-report.json" || true
            fi
          done

      - name: Validate Magisk & Trampoline Integration
        run: |
          for PKG_DIR in MagiskOnWSA/output/WSA_*/; do
            if [ -d "$PKG_DIR" ]; then
              PKG_BASE=$(basename "$PKG_DIR")
              EDITION="standard"
              if [[ "$PKG_BASE" =~ [Vv]anilla ]]; then EDITION="vanilla"; fi
              echo "[*] Validating ramdisk integration for $EDITION: $PKG_DIR"
              python3 scripts/validate_magisk.py --package-dir "$PKG_DIR" --output-report "magisk-validation-report-${EDITION}.json"
              cp "magisk-validation-report-${EDITION}.json" "magisk-validation-report.json" || true
            fi
          done

      - name: Validate GApps Integration
        run: |
          for PKG_DIR in MagiskOnWSA/output/WSA_*/; do
            if [ -d "$PKG_DIR" ]; then
              PKG_BASE=$(basename "$PKG_DIR")
              EDITION="standard"
              if [[ "$PKG_BASE" =~ [Vv]anilla ]]; then EDITION="vanilla"; fi
              echo "[*] Validating GApps integration for $EDITION: $PKG_DIR"
              python3 scripts/validate_gapps.py --package-dir "$PKG_DIR" --output-report "gapps-validation-report-${EDITION}.json"
              cp "gapps-validation-report-${EDITION}.json" "gapps-validation-report.json" || true
            fi
          done

      - name: Generate Checksums and Release Metadata 📊
        run: |
          PRIMARY_PKG=$(find MagiskOnWSA/output -maxdepth 1 -type d -name "WSA_*" | head -n 1)
          python3 scripts/generate_release_metadata.py \
            --package-dir "$PRIMARY_PKG" \
            --output-dir MagiskOnWSA/output \
            --version "${{ inputs.wsa_ver || '2407.40000.4.0' }}" \
            --variant "${{ inputs.variant || 'Tier1_MultiConfig_Retail_x64' }}"

      - name: Determine Target Release Tag & Title
        id: release-info
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_WSA_VER: ${{ inputs.wsa_ver }}
          INPUT_WSA_MESSAGE: ${{ inputs.wsa_message }}
        run: |
          # Extract WSA version from deployment/version.json if not provided
          DEFAULT_WSA_VER=$(python3 -c "import json; print(json.load(open('deployment/version.json'))['subsystem_baseline']['wsa_version'])" 2>/dev/null || echo "2311.40000.5.0")
          
          TAG=""
          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG="$INPUT_TAG_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_WSA_VER" ]; then
            TAG="Windows_11_${INPUT_WSA_VER}"
          else
            TAG="Windows_11_${DEFAULT_WSA_VER}"
          fi

          TITLE=""
          if [ -n "$INPUT_WSA_MESSAGE" ]; then
            TITLE="$INPUT_WSA_MESSAGE"
          elif [ -n "$INPUT_WSA_VER" ]; then
            TITLE="Windows Subsystem For Android ${INPUT_WSA_VER} for Windows 11 x64"
          else
            TITLE="Windows Subsystem For Android ${DEFAULT_WSA_VER} for Windows 11 x64"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release 🚀
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          name: ${{ steps.release-info.outputs.title }}
          body_path: ${{ hashFiles('Windows11x64.md') != '' && 'Windows11x64.md' || '' }}
          files: |
            MagiskOnWSA/output/*.7z
            MagiskOnWSA/output/checksums.sha256
            MagiskOnWSA/output/checksums.sha512
            MagiskOnWSA/output/checksums.txt
            MagiskOnWSA/output/release-metadata.json
            package-identity-report*.json
            package-integrity-report*.json
            magisk-validation-report*.json
            gapps-validation-report*.json
          fail_on_unmatched_files: false
          generate_release_notes: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
