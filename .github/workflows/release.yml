name: Production Release Engineering Pipeline

on:
  workflow_dispatch:
    inputs:
      wsa_ver:
        description: 'WSA Version string (e.g. 2407.40000.4.0)'
        required: true
        default: '2407.40000.4.0'
      variant:
        description: 'Variant name identifier'
        required: true
        default: 'Magisk_GApps_Retail_x64'
  push:
    tags:
      - 'Windows_*'
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  validate-baseline:
    name: Package Identity & Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Package Identity Baseline
        run: |
          python scripts/validate_package_identity.py --baseline config/baseline-identity.json

      - name: Run Offline Unit Tests
        run: |
          python -m unittest discover -s tests -v

  build-and-release:
    name: Build, Verify & Publish Release
    needs: validate-baseline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Environment
        run: |
          git log -n 1 --oneline
          python --version

      - name: Check Package Integrity
        run: |
          python scripts/validate_package_integrity.py

      - name: Validate Magisk Implementation
        run: |
          python scripts/validate_magisk.py

      - name: Validate GApps Implementation
        run: |
          python scripts/validate_gapps.py

      - name: Generate Checksums and Release Metadata
        run: |
          python scripts/generate_release_metadata.py --version "${{ inputs.wsa_ver || '2407.40000.4.0' }}" --variant "${{ inputs.variant || 'Magisk_GApps_Retail_x64' }}"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            output/*.7z
            output/checksums.sha256
            output/checksums.sha512
            output/checksums.txt
            output/release-metadata.json
            package-identity-report.json
            package-integrity-report.json
          fail_on_unmatched_files: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
