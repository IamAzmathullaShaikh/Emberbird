name: Production Release Pipeline

on:
  push:
    tags:
      - 'Windows_*'
      - 'v*'
  workflow_dispatch:
    inputs:
      wsa_ver:
        description: 'WSA Version (e.g. 2407.40000.4.0)'
        required: true
        default: '2407.40000.4.0'
      variant:
        description: 'Target Variant Name'
        required: true
        default: 'Magisk_GApps_Retail_x64'

permissions:
  contents: write
  packages: write

jobs:
  verify-quality-gates:
    name: Verify Quality & Identity Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Identity Baseline
        run: |
          python3 scripts/validate_package_identity.py --baseline config/baseline-identity.json

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

  build-and-publish:
    name: Build, Package & Publish Release
    needs: verify-quality-gates
    runs-on: windows-latest
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Package Structural Integrity
        run: |
          python scripts/validate_package_integrity.py

      - name: Validate Magisk Trampoline
        run: |
          python scripts/validate_magisk.py

      - name: Validate GApps Integration
        run: |
          python scripts/validate_gapps.py

      - name: Generate Checksums and Release Metadata 📊
        run: |
          python scripts/generate_release_metadata.py \
            --version "${{ inputs.wsa_ver || '2407.40000.4.0' }}" \
            --variant "${{ inputs.variant || 'Magisk_GApps_Retail_x64' }}"

      - name: Publish GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            output/*.7z
            output/checksums.sha256
            output/checksums.sha512
            output/checksums.txt
            output/release-metadata.json
            package-identity-report.json
            package-integrity-report.json
          fail_on_unmatched_files: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
