name: Production Release Pipeline

on:
  push:
    tags:
      - 'Windows_*'
      - 'v*'
  workflow_dispatch:
    inputs:
      wsa_ver:
        description: 'WSA Version (optional, e.g. 2407.40000.4.0)'
        required: false
      variant:
        description: 'Target Variant Name'
        required: false
        default: 'Magisk_GApps_Retail_x64'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-quality-gates:
    name: Verify Quality & Identity Baseline Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Identity Baseline Schema
        run: |
          python3 scripts/validate_package_identity.py --baseline config/baseline-identity.json

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

  build-release-package:
    name: Build WSA Package (Magisk Stable + OpenGApps Pico)
    needs: verify-quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Maximize Runner Disk Space 🧹
        run: |
          echo "[*] Freeing runner storage space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full unzip

      - name: Install Python Requirements
        run: |
          pip3 install --quiet -r MagiskOnWSA/requirements.txt

      - name: Execute WSA Core Build Script ⚙️
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd MagiskOnWSA/scripts
          bash build.sh --compress-format 7z

      - name: Compress Release Distribution (.7z) 🗜️
        run: |
          PKG_DIR=$(find MagiskOnWSA/output -maxdepth 1 -type d -name "WSA_*" | head -n 1)
          if [ -n "$PKG_DIR" ] && [ ! -f "${PKG_DIR}.7z" ]; then
            echo "[*] Compressing $PKG_DIR into 7z archive..."
            7z a -mx=7 "${PKG_DIR}.7z" "$PKG_DIR"
          fi

      - name: Archive Built Packages 📦
        uses: actions/upload-artifact@v4
        with:
          name: wsa-built-distribution
          path: |
            MagiskOnWSA/output/*.7z
            MagiskOnWSA/output/WSA_*/AppxManifest.xml
            MagiskOnWSA/output/WSA_*/Install.ps1
            MagiskOnWSA/output/WSA_*/Run.bat
            MagiskOnWSA/output/WSA_*/Tools/initrd.img
          retention-days: 2

  validate-and-publish:
    name: Validate, Hash & Publish Release
    needs: build-release-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Built Package Artifacts 📥
        uses: actions/download-artifact@v4
        with:
          name: wsa-built-distribution
          path: MagiskOnWSA/output

      - name: Validate Package Structural Integrity
        run: |
          PKG_DIR=$(find MagiskOnWSA/output -maxdepth 1 -type d -name "WSA_*" | head -n 1)
          if [ -z "$PKG_DIR" ]; then
            echo "[-] Error: Built package directory not found in artifacts!" >&2
            exit 2
          fi
          echo "[*] Found package directory: $PKG_DIR"
          python3 scripts/validate_package_integrity.py --package-dir "$PKG_DIR" --require-package

      - name: Validate Package Identity
        run: |
          PKG_DIR=$(find MagiskOnWSA/output -maxdepth 1 -type d -name "WSA_*" | head -n 1)
          python3 scripts/validate_package_identity.py --package-dir "$PKG_DIR" --require-manifest

      - name: Validate Magisk Trampoline
        run: |
          PKG_DIR=$(find MagiskOnWSA/output -maxdepth 1 -type d -name "WSA_*" | head -n 1)
          python3 scripts/validate_magisk.py --package-dir "$PKG_DIR"

      - name: Validate GApps Integration
        run: |
          PKG_DIR=$(find MagiskOnWSA/output -maxdepth 1 -type d -name "WSA_*" | head -n 1)
          python3 scripts/validate_gapps.py --package-dir "$PKG_DIR"

      - name: Generate Checksums and Release Metadata 📊
        run: |
          PKG_DIR=$(find MagiskOnWSA/output -maxdepth 1 -type d -name "WSA_*" | head -n 1)
          python3 scripts/generate_release_metadata.py \
            --package-dir "$PKG_DIR" \
            --output-dir MagiskOnWSA/output \
            --version "${{ inputs.wsa_ver || '2407.40000.4.0' }}" \
            --variant "${{ inputs.variant || 'Magisk_GApps_Retail_x64' }}"

      - name: Publish GitHub Release 🚀
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            MagiskOnWSA/output/*.7z
            MagiskOnWSA/output/checksums.sha256
            MagiskOnWSA/output/checksums.sha512
            MagiskOnWSA/output/checksums.txt
            MagiskOnWSA/output/release-metadata.json
            package-identity-report.json
            package-integrity-report.json
            magisk-validation-report.json
            gapps-validation-report.json
          fail_on_unmatched_files: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
