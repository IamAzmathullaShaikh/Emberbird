name: Windows Validation Lab Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0' # Weekly Sunday run

jobs:
  run-validation-lab:
    name: Self-Hosted WSA Diagnostics & Upgrade Validation
    # Targets self-hosted runner configured with setup_validation_runner.ps1
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute WSA Upgrade Compatibility Test Harness
        run: |
          powershell.exe -ExecutionPolicy Bypass -File scripts/validate_upgrade.ps1

      - name: Run Live Magisk Diagnostics
        run: |
          python scripts/validate_magisk.py --live

      - name: Run Live GApps Registration Diagnostics
        run: |
          python scripts/validate_gapps.py --live

      - name: Archive Validation Lab Reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-lab-reports
          path: |
            upgrade-validation-report.json
            magisk-validation-report.json
            gapps-validation-report.json
